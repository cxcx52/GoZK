[package]
name = "hyperplonk-repair"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
ark-bls12-381 = "=0.4.0"
ark-ec = "=0.4.2"
ark-ff = "=0.4.2"
ark-serialize = "=0.4.2"
ark-std = "=0.4.0"
rand = "=0.8.5"
sha2 = "=0.10.8"
sha3 = "=0.10.8"
num-bigint = "=0.4.6"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
hex = "=0.4.3"
rayon = { version = "=1.10.0", optional = true }
libc = "=0.2.191"

[profile.release]
lto = "thin"
codegen-units = 1

[features]
default = []
parallel = ["dep:rayon", "ark-ec/parallel", "ark-ff/parallel", "ark-std/parallel"]
